name: Weektable
options:
  bundleIdPrefix: com.weektable
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Weektable
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    WEEKTABLE_API_BASE_URL: ""
    WEEKTABLE_PRIVACY_URL: ""
    WEEKTABLE_TERMS_URL: ""
    WEEKTABLE_SUPPORT_URL: ""
    INFOPLIST_KEY_WEEKTABLE_API_BASE_URL: "$(WEEKTABLE_API_BASE_URL)"
    INFOPLIST_KEY_WEEKTABLE_PRIVACY_URL: "$(WEEKTABLE_PRIVACY_URL)"
    INFOPLIST_KEY_WEEKTABLE_TERMS_URL: "$(WEEKTABLE_TERMS_URL)"
    INFOPLIST_KEY_WEEKTABLE_SUPPORT_URL: "$(WEEKTABLE_SUPPORT_URL)"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Weektable:
    type: application
    platform: iOS
    sources:
      - Weektable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weektable.ios
    preBuildScripts:
      - name: Validate Release configuration
        script: bash "$SRCROOT/Scripts/validate-release-config.sh"
    scheme:
      storeKitConfiguration: Weektable/Configuration/Weektable.storekit
      testTargets:
        - WeektableTests
        - WeektableUITests
  WeektableTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WeektableTests
    dependencies:
      - target: Weektable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weektable.ios.tests
  WeektableUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WeektableUITests
    dependencies:
      - target: Weektable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weektable.ios.uitests
