name: Weektable
options:
  bundleIdPrefix: com.weektable
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Cove
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    COVE_RUNTIME_MODE: DEVELOPMENT_FIXTURE
    COVE_API_BASE_URL: ""
    COVE_PRIVACY_URL: ""
    COVE_TERMS_URL: ""
    COVE_SUPPORT_URL: ""
    INFOPLIST_KEY_COVE_RUNTIME_MODE: "$(COVE_RUNTIME_MODE)"
    INFOPLIST_KEY_COVE_API_BASE_URL: "$(COVE_API_BASE_URL)"
    INFOPLIST_KEY_COVE_PRIVACY_URL: "$(COVE_PRIVACY_URL)"
    INFOPLIST_KEY_COVE_TERMS_URL: "$(COVE_TERMS_URL)"
    INFOPLIST_KEY_COVE_SUPPORT_URL: "$(COVE_SUPPORT_URL)"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Weektable:
    type: application
    platform: iOS
    sources:
      - Weektable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weektable.ios
      configs:
        Debug:
          COVE_RUNTIME_MODE: DEVELOPMENT_FIXTURE
        Release:
          COVE_RUNTIME_MODE: PRODUCTION_LIVE
    preBuildScripts:
      - name: Validate Release configuration
        script: bash "$SRCROOT/Scripts/validate-release-config.sh"
    scheme:
      storeKitConfiguration: Weektable/Configuration/Weektable.storekit
      testTargets:
        - WeektableTests
        - WeektableUITests
  WeektableTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WeektableTests
    dependencies:
      - target: Weektable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weektable.ios.tests
  WeektableUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WeektableUITests
    dependencies:
      - target: Weektable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weektable.ios.uitests
