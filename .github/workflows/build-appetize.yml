name: Build Weektable for Appetize

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-build:
    name: Web checks and iOS Simulator app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install web dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Validate backend and web
        working-directory: app
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Validate Release configuration contract
        working-directory: ios
        run: |
          if CONFIGURATION=Release bash Scripts/validate-release-config.sh 2>/dev/null; then
            echo "Release validation unexpectedly accepted missing values" >&2
            exit 1
          fi
          CONFIGURATION=Release \
          WEEKTABLE_API_BASE_URL=https://api.example.com \
          WEEKTABLE_PRIVACY_URL=https://example.com/privacy \
          WEEKTABLE_TERMS_URL=https://example.com/terms \
          WEEKTABLE_SUPPORT_URL=https://example.com/support \
          bash Scripts/validate-release-config.sh

      - name: Run Swift unit and UI tests
        working-directory: ios
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild test \
            -project Weektable.xcodeproj \
            -scheme Weektable \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcode-test.log

      - name: Build and package for Appetize
        working-directory: ios
        run: bash Scripts/build-appetize.sh

      - name: Upload the Appetize-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Weektable-Appetize
          path: ios/build/Weektable-Appetize.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Weektable-Xcode-Log
          path: ios/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the Xcode test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Weektable-Xcode-Test-Log
          path: ios/build/xcode-test.log
          if-no-files-found: ignore
          retention-days: 14
