name: Build Cove for Appetize

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-build:
    name: Web checks and iOS Simulator app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install web dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Validate backend and web
        working-directory: app
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Validate Release configuration contract
        working-directory: ios
        run: |
          if CONFIGURATION=Release bash Scripts/validate-release-config.sh 2>/dev/null; then
            echo "Release validation unexpectedly accepted missing values" >&2
            exit 1
          fi
          CONFIGURATION=Release \
          COVE_RUNTIME_MODE=PRODUCTION_LIVE \
          COVE_API_BASE_URL=https://api.example.com \
          COVE_PRIVACY_URL=https://example.com/privacy \
          COVE_TERMS_URL=https://example.com/terms \
          COVE_SUPPORT_URL=https://example.com/support \
          bash Scripts/validate-release-config.sh

      - name: Run Swift unit and UI tests
        working-directory: ios
        run: |
          mkdir -p build
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [[ -z "$DEVICE_ID" ]]; then
            RUNTIME_ID=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable == true and (.identifier | contains("iOS")))][-1].identifier // empty')
            DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | startswith("iPhone"))][0].identifier // empty')
            [[ -n "$RUNTIME_ID" && -n "$DEVICE_TYPE_ID" ]] || { echo "No available iOS Simulator runtime/device type" >&2; exit 1; }
            DEVICE_ID=$(xcrun simctl create Weektable-CI "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          set -o pipefail
          xcodebuild test \
            -project Weektable.xcodeproj \
            -scheme Weektable \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcode-test.log

      - name: Build and package for Appetize
        working-directory: ios
        run: bash Scripts/build-appetize.sh

      - name: Upload the Appetize-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Cove-Appetize
          path: ios/build/Cove-Appetize.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cove-Xcode-Log
          path: ios/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the Xcode test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cove-Xcode-Test-Log
          path: ios/build/xcode-test.log
          if-no-files-found: ignore
          retention-days: 14
