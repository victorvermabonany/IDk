name: Build Weektable for Appetize

on:
  workflow_dispatch:
  push:
    paths:
      - "Weektable-Appetize-Build-Kit-v6.zip"
      - ".github/workflows/build-appetize.yml"

permissions:
  contents: read

jobs:
  simulator-build:
    name: iOS Simulator app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Extract production V1 build kit
        run: |
          mkdir -p release
          ditto -x -k Weektable-Appetize-Build-Kit-v6.zip release

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: release/ios
        run: xcodegen generate

      - name: Run iOS unit tests
        working-directory: release/ios
        run: |
          xcodebuild test \
            -project Weektable.xcodeproj \
            -scheme Weektable \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -only-testing:WeektableTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Build and package for Appetize
        working-directory: release/ios
        run: bash Scripts/build-appetize.sh

      - name: Upload the Appetize-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Weektable-Appetize
          path: release/ios/build/Weektable-Appetize.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Weektable-Xcode-Log
          path: release/ios/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
