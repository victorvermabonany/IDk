name: Build Cove for Appetize

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-appetize.yml
      - app/**
      - ios/**
      - shared/**
      - BROWSERSTACK_APP_LIVE.md
  workflow_dispatch:
    inputs:
      runtime_mode:
        description: Runtime mode embedded in the simulator app
        required: true
        default: DEVELOPMENT_FIXTURE
        type: choice
        options:
          - DEVELOPMENT_FIXTURE
          - STAGING_LIVE
          - PRODUCTION_LIVE
      api_base_url:
        description: HTTPS Cove backend URL (required for live modes)
        required: false
        type: string
      privacy_url:
        description: HTTPS privacy page URL (required for live modes)
        required: false
        type: string
      terms_url:
        description: HTTPS terms page URL (required for live modes)
        required: false
        type: string
      support_url:
        description: HTTPS support page URL (required for live modes)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cove-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  COVE_RUNTIME_MODE: ${{ inputs.runtime_mode || 'PRODUCTION_LIVE' }}
  COVE_API_BASE_URL: ${{ inputs.api_base_url || 'https://cove-planner-delta.vercel.app' }}
  COVE_PRIVACY_URL: ${{ inputs.privacy_url || 'https://cove-planner-delta.vercel.app/privacy' }}
  COVE_TERMS_URL: ${{ inputs.terms_url || 'https://cove-planner-delta.vercel.app/terms' }}
  COVE_SUPPORT_URL: ${{ inputs.support_url || 'https://cove-planner-delta.vercel.app/support' }}

jobs:
  simulator-build:
    name: Web checks and iOS Simulator app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install web dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Validate backend and web
        working-directory: app
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Validate Release configuration contract
        working-directory: ios
        run: |
          if CONFIGURATION=Release \
             COVE_RUNTIME_MODE= \
             COVE_API_BASE_URL= \
             COVE_PRIVACY_URL= \
             COVE_TERMS_URL= \
             COVE_SUPPORT_URL= \
             bash Scripts/validate-release-config.sh 2>/dev/null; then
            echo "Release validation unexpectedly accepted missing values" >&2
            exit 1
          fi
          CONFIGURATION=Release \
          COVE_RUNTIME_MODE=PRODUCTION_LIVE \
          COVE_API_BASE_URL=https://api.example.com \
          COVE_PRIVACY_URL=https://example.com/privacy \
          COVE_TERMS_URL=https://example.com/terms \
          COVE_SUPPORT_URL=https://example.com/support \
          bash Scripts/validate-release-config.sh

      - name: Run Swift unit and UI tests
        working-directory: ios
        run: |
          mkdir -p build
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [[ -z "$DEVICE_ID" ]]; then
            RUNTIME_ID=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable == true and (.identifier | contains("iOS")))][-1].identifier // empty')
            DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | startswith("iPhone"))][0].identifier // empty')
            [[ -n "$RUNTIME_ID" && -n "$DEVICE_TYPE_ID" ]] || { echo "No available iOS Simulator runtime/device type" >&2; exit 1; }
            DEVICE_ID=$(xcrun simctl create Weektable-CI "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          set -o pipefail
          xcodebuild test \
            -project Weektable.xcodeproj \
            -scheme Weektable \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcode-test.log

      - name: Build and package for Appetize
        working-directory: ios
        run: bash Scripts/build-appetize.sh

      - name: Verify embedded Appetize configuration
        working-directory: ios
        env:
          EXPECTED_RUNTIME_MODE: ${{ env.COVE_RUNTIME_MODE }}
          EXPECTED_API_BASE_URL: ${{ env.COVE_API_BASE_URL }}
          EXPECTED_PRIVACY_URL: ${{ env.COVE_PRIVACY_URL }}
          EXPECTED_TERMS_URL: ${{ env.COVE_TERMS_URL }}
          EXPECTED_SUPPORT_URL: ${{ env.COVE_SUPPORT_URL }}
        run: |
          PLIST=build/DerivedData/Build/Products/Debug-iphonesimulator/Weektable.app/Info.plist
          [[ -f "$PLIST" ]] || { echo "Missing packaged Info.plist" >&2; exit 1; }
          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST"; }
          [[ "$(read_key COVE_RUNTIME_MODE)" == "$EXPECTED_RUNTIME_MODE" ]] || { echo "Runtime mode was not embedded" >&2; exit 1; }
          if [[ "$EXPECTED_RUNTIME_MODE" != "DEVELOPMENT_FIXTURE" ]]; then
            [[ "$(read_key COVE_API_BASE_URL)" == "$EXPECTED_API_BASE_URL" ]] || { echo "API URL was not embedded" >&2; exit 1; }
            [[ "$(read_key COVE_PRIVACY_URL)" == "$EXPECTED_PRIVACY_URL" ]] || { echo "Privacy URL was not embedded" >&2; exit 1; }
            [[ "$(read_key COVE_TERMS_URL)" == "$EXPECTED_TERMS_URL" ]] || { echo "Terms URL was not embedded" >&2; exit 1; }
            [[ "$(read_key COVE_SUPPORT_URL)" == "$EXPECTED_SUPPORT_URL" ]] || { echo "Support URL was not embedded" >&2; exit 1; }
          fi

      - name: Capture native Cove redesign screens
        working-directory: ios
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices booted -j | jq -r '[.devices[][]][0].udid // empty')
          [[ -n "$DEVICE_ID" ]] || { echo "No booted iOS Simulator was available for screenshots." >&2; exit 1; }
          APP_PATH=build/DerivedData/Build/Products/Debug-iphonesimulator/Weektable.app
          BUNDLE_ID=com.weektable.ios
          SCREENSHOT_DIR=build/ui-screenshots
          mkdir -p "$SCREENSHOT_DIR"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl status_bar "$DEVICE_ID" override --time 9:41 --batteryState charged --batteryLevel 100 || true

          capture() {
            local name="$1"
            shift
            xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID" "$@"
            sleep 3
            xcrun simctl io "$DEVICE_ID" screenshot "$SCREENSHOT_DIR/$name.png"
          }

          capture welcome -cove-ui-test-reset
          capture home -cove-ui-test-reset -cove-ui-test-active-plan
          capture week -cove-ui-test-reset -cove-ui-test-active-plan -cove-ui-test-week
          capture assistant -cove-ui-test-reset -cove-ui-test-active-plan -cove-ui-test-assistant

      - name: Capture compact, standard, and Pro Max layout QA
        working-directory: ios
        run: |
          set -euo pipefail
          APP_PATH=build/DerivedData/Build/Products/Debug-iphonesimulator/Weektable.app
          BUNDLE_ID=com.weektable.ios
          SCREENSHOT_DIR=build/ui-screenshots
          RUNTIME_ID=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable == true and (.identifier | contains("iOS")))][-1].identifier // empty')
          [[ -n "$RUNTIME_ID" ]] || { echo "No available iOS Simulator runtime." >&2; exit 1; }

          resolve_type() {
            local type_id=""
            for name in "$@"; do
              type_id=$(xcrun simctl list devicetypes -j | jq -r --arg name "$name" '[.devicetypes[] | select(.name == $name)][0].identifier // empty')
              [[ -n "$type_id" ]] && { echo "$type_id"; return; }
            done
            return 1
          }

          capture_device() {
            local label="$1"
            local type_id="$2"
            local device_id
            device_id=$(xcrun simctl create "Cove-QA-$label" "$type_id" "$RUNTIME_ID")
            xcrun simctl boot "$device_id"
            xcrun simctl bootstatus "$device_id" -b
            xcrun simctl install "$device_id" "$APP_PATH"
            xcrun simctl ui "$device_id" appearance light
            xcrun simctl status_bar "$device_id" override --time 9:41 --batteryState charged --batteryLevel 100 || true

            capture() {
              local screen="$1"
              shift
              xcrun simctl terminate "$device_id" "$BUNDLE_ID" 2>/dev/null || true
              xcrun simctl launch "$device_id" "$BUNDLE_ID" "$@"
              sleep 2
              xcrun simctl io "$device_id" screenshot "$SCREENSHOT_DIR/$label-$screen.png"
            }

            capture home -cove-ui-test-reset -cove-ui-test-active-plan
            capture week -cove-ui-test-reset -cove-ui-test-active-plan -cove-ui-test-week
            capture groceries -cove-ui-test-reset -cove-ui-test-active-plan -cove-ui-test-groceries
            capture recipe -cove-ui-test-reset -cove-ui-test-active-plan -cove-ui-test-recipe
            xcrun simctl shutdown "$device_id"
            xcrun simctl delete "$device_id"
          }

          COMPACT_TYPE=$(resolve_type "iPhone SE (3rd generation)" "iPhone 13 mini")
          STANDARD_TYPE=$(resolve_type "iPhone 16" "iPhone 15" "iPhone 14")
          MAX_TYPE=$(resolve_type "iPhone 16 Pro Max" "iPhone 15 Pro Max" "iPhone 14 Pro Max")
          capture_device compact "$COMPACT_TYPE"
          capture_device standard "$STANDARD_TYPE"
          capture_device pro-max "$MAX_TYPE"

      - name: Upload the Appetize-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Cove-Appetize
          path: ios/build/Cove-Appetize.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload native redesign screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Cove-UI-Screenshots
          path: ios/build/ui-screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cove-Xcode-Log
          path: ios/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the Xcode test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cove-Xcode-Test-Log
          path: ios/build/xcode-test.log
          if-no-files-found: ignore
          retention-days: 14

  browserstack-device-build:
    name: Physical iPhone IPA and App Live upload
    needs: simulator-build
    if: ${{ (inputs.runtime_mode || 'PRODUCTION_LIVE') != 'DEVELOPMENT_FIXTURE' }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build physical-iPhone IPA for BrowserStack
        working-directory: ios
        run: bash Scripts/build-browserstack.sh

      - name: Verify embedded BrowserStack configuration
        working-directory: ios
        run: |
          VERIFY_ROOT=build/browserstack-verify
          rm -rf "$VERIFY_ROOT"
          mkdir -p "$VERIFY_ROOT"
          /usr/bin/unzip -q build/Cove-BrowserStack.ipa -d "$VERIFY_ROOT"
          PLIST="$VERIFY_ROOT/Payload/Weektable.app/Info.plist"
          [[ -f "$PLIST" ]] || { echo "Missing packaged Info.plist" >&2; exit 1; }
          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST"; }
          [[ "$(read_key CFBundleIdentifier)" == "com.weektable.ios" ]] || { echo "Unexpected bundle identifier" >&2; exit 1; }
          [[ "$(read_key COVE_RUNTIME_MODE)" == "$COVE_RUNTIME_MODE" ]] || { echo "Runtime mode was not embedded" >&2; exit 1; }
          [[ "$(read_key COVE_API_BASE_URL)" == "$COVE_API_BASE_URL" ]] || { echo "API URL was not embedded" >&2; exit 1; }
          [[ "$(read_key COVE_PRIVACY_URL)" == "$COVE_PRIVACY_URL" ]] || { echo "Privacy URL was not embedded" >&2; exit 1; }
          [[ "$(read_key COVE_TERMS_URL)" == "$COVE_TERMS_URL" ]] || { echo "Terms URL was not embedded" >&2; exit 1; }
          [[ "$(read_key COVE_SUPPORT_URL)" == "$COVE_SUPPORT_URL" ]] || { echo "Support URL was not embedded" >&2; exit 1; }

      - name: Upload BrowserStack IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cove-BrowserStack-IPA
          path: ios/build/Cove-BrowserStack.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Explain skipped App Live upload
        if: env.BROWSERSTACK_USERNAME == '' || env.BROWSERSTACK_ACCESS_KEY == ''
        run: |
          echo "::notice::Cove-BrowserStack.ipa passed validation, but the App Live upload was skipped. Add BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY as GitHub Actions secrets."

      - name: Upload IPA to BrowserStack App Live
        if: env.BROWSERSTACK_USERNAME != '' && env.BROWSERSTACK_ACCESS_KEY != ''
        working-directory: ios
        run: |
          RESPONSE_FILE=build/browserstack-upload-response.json
          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output "$RESPONSE_FILE" \
            --write-out '%{http_code}' \
            --user "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            --request POST \
            'https://api-cloud.browserstack.com/app-live/upload' \
            --form 'file=@build/Cove-BrowserStack.ipa' \
            --form 'data={"custom_id":"cove-ios"}')

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "BrowserStack App Live upload failed with HTTP $HTTP_STATUS." >&2
            python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); print(data.get("error", "Upload failed"))' "$RESPONSE_FILE" >&2 || true
            exit 1
          fi

          APP_URL=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("app_url", ""))' "$RESPONSE_FILE")
          echo "BrowserStack App Live upload succeeded."
          if [[ -n "$APP_URL" ]]; then
            echo "BrowserStack app reference: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BrowserStack accepted the IPA with HTTP $HTTP_STATUS." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload BrowserStack build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cove-BrowserStack-Xcode-Log
          path: ios/build/browserstack-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
